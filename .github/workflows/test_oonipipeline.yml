name: test oonipipeline
on: push
jobs:
  run_tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # Contrary to oonidata, which is a tool for end users, oonipipeline
      # targets a single python version to minimize the likelyhood of breakage
      # in production.
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Install hatch
        run: |
          pip install click==8.1.8
          pip install "hatch>=1.13" "virtualenv<21"

      - name: Verify docker is available
        run: docker version && docker compose version

      # Run first, in isolation: fast canary feedback, and it must NOT
      # overlap with the single-node docker-compose stack the rest of the
      # suite uses below -- the cluster fixture brings up its own 5
      # containers (2 CH replicas + 3 Keeper) and running both stacks at
      # once starves the runner and causes unrelated tests to time out.
      - name: Run cluster tests
        run: hatch run test tests -m cluster -rs -v
        working-directory: ./oonipipeline/

      - name: Set up datadir cache
        uses: actions/cache@v3
        with:
          path: oonipipeline/tests/data/datadir/
          key: oonipipeline-tests-data-datadir

      - name: Set up measurements cache
        uses: actions/cache@v5
        with:
          path: oonipipeline/tests/data/measurements/
          key: oonipipeline-tests-data-measurements

      - name: Set up raw_measurements cache
        uses: actions/cache@v5
        with:
          path: oonipipeline/tests/data/raw_measurements/
          key: oonipipeline-tests-data-raw_measurements-${{ hashFiles('tests/conftest.py') }}

      - name: Install clickhouse
        run: |
          sudo apt-get install -y apt-transport-https ca-certificates dirmngr
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv 8919F6BD2B48D754
          echo "deb https://packages.clickhouse.com/deb stable main" | sudo tee \
              /etc/apt/sources.list.d/clickhouse.list
          sudo apt-get update
          sudo apt-get install -y clickhouse-server clickhouse-client

      - name: Run all tests
        run: hatch run cov tests -m "not cluster" -vvv
        working-directory: ./oonipipeline/

      - name: Dump ClickHouse container logs on failure
        if: failure()
        run: docker ps -a && docker compose -f tests/docker-compose.yml logs || true
        working-directory: ./oonipipeline/

      - name: Upload coverage to codecov
        uses: codecov/codecov-action@v6
        with:
          flags: oonipipeline
          working-directory: ./oonipipeline/
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
