name: build docs
on: push

jobs:
  build_docs:
    runs-on: "ubuntu-latest"
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Build docs
        run: make docs

      - name: Get current git ref
        id: rev_parse
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Checkout ooni/docs
        uses: actions/checkout@v2
        with:
          repository: "ooni/docs"
          ssh-key: ${{ secrets.OONI_DOCS_DEPLOYKEY }}
          path: "ooni-docs"

      - name: Update docs
        run: |
          mkdir -p ooni-docs/src/content/docs/data/
          # Drop the previously generated files first, so that renaming or
          # removing a document here does not leave a stale copy behind (which
          # would otherwise surface as a duplicate slug when a successor
          # inherits its slug). Only files carrying the generated marker are
          # removed, so anything hand-maintained in ooni/docs survives.
          find ooni-docs/src/content/docs/data/ -type f -name "*.md" \
            -exec grep -q "^# Do not edit! This file is automatically generated" {} \; \
            -print -delete
          cp -R dist/docs/* ooni-docs/src/content/docs/data/

      - name: Check for conflicting slugs
        run: |
          find ooni-docs/src/content/docs/data/ -name "*.md" -exec cat {} + \
            | grep "^slug:" | awk -F':' '{gsub(/^ +/, "", $2); print $2}' | sort | uniq -c \
            | awk '{if ($1 > 1) { print "duplicate slug for: " $2; exit 1}}'

      - name: Print the lines of the generated docs
        run: find ooni-docs/src/content/docs/data/ -name "*.md" -exec wc -l {} +

      - name: Commit changes
        # Only push the docs update when we are in master
        # if: github.ref == 'refs/heads/master'
        run: |
          cd ooni-docs
          git config --global user.email "github+backend@ooni.org"
          git config --global user.name "OONI Github Actions Bot"
          git add .
          git commit -m "auto: update ooni/data docs to ${{ steps.rev_parse.outputs.COMMIT_HASH }}" || echo "No changes to commit"
          git push origin
