name: test oonidata
on: push
jobs:
  # Install as users do, with pip and without hatch, and run the command it
  # installs (#149, #195)
  install:
    name: pip install / ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install oonidata
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install ./oonidata

      - name: Run the oonidata command
        run: |
          "$RUNNER_TEMP/venv/bin/oonidata" --version
          "$RUNNER_TEMP/venv/bin/oonidata" sync --help

  run_tests:
    name: ${{ matrix.os }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}-latest
    strategy:
      matrix:
        os: [Ubuntu]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install hatch
        run: |
          pip install click==8.1.8
          pip install "hatch>=1.13" "virtualenv<21"

      - name: Set up datadir cache
        uses: actions/cache@v3
        with:
          path: oonidata/tests/data/datadir/
          key: oonidata-tests-data-datadir

      - name: Set up measurements cache
        uses: actions/cache@v3
        with:
          path: oonidata/tests/data/measurements/
          key: oonidata-tests-data-measurements

      - name: Set up raw_measurements cache
        uses: actions/cache@v3
        with:
          path: oonidata/tests/data/raw_measurements/
          key: oonidata-tests-data-raw_measurements-${{ hashFiles('tests/conftest.py') }}

      - name: Run all tests
        run: hatch run cov
        working-directory: ./oonidata/

      - name: Upload coverage to codecov
        uses: codecov/codecov-action@v3
        with:
          flags: oonidata
          working-directory: ./oonidata/
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
