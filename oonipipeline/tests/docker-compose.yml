version: '2'
services:
  clickhouse:
    image: "clickhouse/clickhouse-server:24.8.6.70"
    ports:
      - "9000"
    environment:
       CLICKHOUSE_PASSWORD: test
       CLICKHOUSE_USER: test
    volumes:
      # mount the file, not the directory, to keep the image's own config.d
      - ./clickhouse-config.d/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
    healthcheck:
      # CMD-SHELL: podman splits CMD arguments that contain spaces
      test: ["CMD-SHELL", "clickhouse-client --user test --password test --query 'SELECT 1'"]
      interval: 5s
      retries: 10
      start_period: 30s
      timeout: 10s
