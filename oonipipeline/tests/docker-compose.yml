version: '2'
services:
  clickhouse:
    image: "clickhouse/clickhouse-server:25.2"
    ports:
      - "9000"
    environment:
       CLICKHOUSE_PASSWORD: test
       CLICKHOUSE_USER: test
    volumes:
      - ./clickhouse-config.d:/etc/clickhouse-server/config.d:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "test", "--password", "test", "--query", "select 1;"]
      interval: 5s
      retries: 10
      start_period: 30s
      timeout: 10s
