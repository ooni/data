# 1 shard / 2 replicas ClickHouse cluster ("oonidata_cluster", matching
# CLUSTER_NAME in citizenlab_test_lists_updater.py) plus a 3-node
# ClickHouse Keeper ensemble for coordination. Used only by the cluster
# integration tests (see tests/test_citizenlab_cluster.py) -- the rest of
# the suite keeps using the plain single-node tests/docker-compose.yml.
#
# Run standalone with:
#   docker compose -f tests/docker-compose.cluster.yml up -d
#   docker compose -f tests/docker-compose.cluster.yml down -v
version: "3"
services:
  clickhouse-01:
    image: "clickhouse/clickhouse-server:24.8.6.70"
    user: "101:101"
    hostname: clickhouse-01
    volumes:
      - ./clickhouse-cluster-config/clickhouse-01/config.d/config.xml:/etc/clickhouse-server/config.d/config.xml
      - ./clickhouse-cluster-config/clickhouse-01/users.d/users.xml:/etc/clickhouse-server/users.d/users.xml
    ports:
      - "9000"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "select 1;"]
      interval: 5s
      retries: 20
      start_period: 30s
      timeout: 10s
    depends_on:
      - clickhouse-keeper-01
      - clickhouse-keeper-02
      - clickhouse-keeper-03

  clickhouse-02:
    image: "clickhouse/clickhouse-server:24.8.6.70"
    user: "101:101"
    hostname: clickhouse-02
    volumes:
      - ./clickhouse-cluster-config/clickhouse-02/config.d/config.xml:/etc/clickhouse-server/config.d/config.xml
      - ./clickhouse-cluster-config/clickhouse-02/users.d/users.xml:/etc/clickhouse-server/users.d/users.xml
    ports:
      - "9000"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "select 1;"]
      interval: 5s
      retries: 20
      start_period: 30s
      timeout: 10s
    depends_on:
      - clickhouse-keeper-01
      - clickhouse-keeper-02
      - clickhouse-keeper-03

  clickhouse-keeper-01:
    image: "clickhouse/clickhouse-keeper:24.8.6.70-alpine"
    user: "101:101"
    hostname: clickhouse-keeper-01
    volumes:
      - ./clickhouse-cluster-config/clickhouse-keeper-01/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml

  clickhouse-keeper-02:
    image: "clickhouse/clickhouse-keeper:24.8.6.70-alpine"
    user: "101:101"
    hostname: clickhouse-keeper-02
    volumes:
      - ./clickhouse-cluster-config/clickhouse-keeper-02/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml

  clickhouse-keeper-03:
    image: "clickhouse/clickhouse-keeper:24.8.6.70-alpine"
    user: "101:101"
    hostname: clickhouse-keeper-03
    volumes:
      - ./clickhouse-cluster-config/clickhouse-keeper-03/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml
